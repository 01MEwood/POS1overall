# ProduktPass — nginx-Konfiguration für die statische SPA
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-Routing: unbekannte Pfade auf index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted Assets dürfen lange gecacht werden
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html nie cachen (sonst sehen Nutzer alte App-Versionen)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
